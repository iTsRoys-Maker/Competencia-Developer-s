<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - ElectroShop</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { corePlugins: { preflight: false } }
    </script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar !w-60 !bg-[var(--card)] !border-r !border-[var(--border)] !p-6">
            <h3 class="!text-xs !uppercase !tracking-wider !opacity-50 !mb-4 !pl-3">Navegacion</h3>
            <a href="admin.html" class="!block !px-3 !py-2.5 !rounded-lg !font-semibold !mb-1 !bg-[var(--primary)] !text-white !no-underline transition-all duration-200">Dashboard</a>
            <a href="admin-products.html" class="!block !px-3 !py-2.5 !rounded-lg !font-semibold !mb-1 hover:!bg-[var(--primary)] hover:!text-white !text-[var(--text)] !no-underline transition-all duration-200">Productos</a>
            <a href="admin.html" class="!block !px-3 !py-2.5 !rounded-lg !font-semibold !mb-1 hover:!bg-[var(--primary)] hover:!text-white !text-[var(--text)] !no-underline transition-all duration-200">Pedidos</a>
            <hr class="!border-none !border-t !border-[var(--border)] !my-4">
            <a href="index.html" class="!block !px-3 !py-2.5 !rounded-lg !font-semibold !mb-1 hover:!bg-[var(--primary)] hover:!text-white !text-[var(--text)] !no-underline transition-all duration-200">← Volver a la Tienda</a>
        </aside>

        <main class="admin-content !p-8">
            <h2 class="!text-2xl !font-bold !mb-6 !text-[var(--text)]">Gestion de Pedidos</h2>

            <div id="stats" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                <div class="stat-card !rounded-xl !shadow-lg !p-6 !text-center !bg-[var(--card)] transition-all duration-300 hover:!shadow-xl">
                    <h3 id="total-pedidos" class="!text-3xl !font-bold !mb-1 !text-[var(--text)]">0</h3>
                    <p class="!text-sm !opacity-70 !text-[var(--text)]">Total Pedidos</p>
                </div>
                <div class="stat-card !rounded-xl !shadow-lg !p-6 !text-center !bg-amber-500 !text-white transition-all duration-300 hover:!shadow-xl">
                    <h3 id="pedidos-pendientes" class="!text-3xl !font-bold !mb-1">0</h3>
                    <p class="!text-sm !opacity-90">Pendientes</p>
                </div>
                <div class="stat-card !rounded-xl !shadow-lg !p-6 !text-center !bg-green-600 !text-white transition-all duration-300 hover:!shadow-xl">
                    <h3 id="pedidos-completados" class="!text-3xl !font-bold !mb-1">0</h3>
                    <p class="!text-sm !opacity-90">Completados</p>
                </div>
                <div class="stat-card !rounded-xl !shadow-lg !p-6 !text-center !bg-[var(--primary)] !text-white transition-all duration-300 hover:!shadow-xl">
                    <h3 id="total-ventas" class="!text-3xl !font-bold !mb-1">$0</h3>
                    <p class="!text-sm !opacity-90">Total Ventas</p>
                </div>
            </div>

            <div id="orders-container">
                <p>Cargando pedidos...</p>
            </div>
        </main>
    </div>

    <script>
        async function loadAdminOrders() {
            const token = getToken();
            const user = getUser();
            if (!token || user?.rol !== 'ADMIN') {
                alert('Acceso denegado');
                window.location.href = 'login.html';
                return;
            }
            try {
                const [ordersRes, statsRes] = await Promise.all([
                    fetch(API_URL + '/admin/orders', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    }),
                    fetch(API_URL + '/admin/stats', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    })
                ]);
                const orders = await ordersRes.json();
                const stats = await statsRes.json();
                document.getElementById('total-pedidos').textContent = stats.totalPedidos || 0;
                document.getElementById('pedidos-pendientes').textContent = stats.pedidosPendientes || 0;
                document.getElementById('pedidos-completados').textContent = stats.pedidosCompletados || 0;
                document.getElementById('total-ventas').textContent = formatCOP(stats.totalVentas || 0);
                const container = document.getElementById('orders-container');
                if (!orders || orders.length === 0) {
                    container.innerHTML = '<p>No hay pedidos ancora.</p>';
                    return;
                }
                container.innerHTML = orders.map(order => `
                    <div class="!bg-[var(--card)] !rounded-xl !shadow-lg !p-6 !mb-4 transition-all duration-300 hover:!shadow-xl">
                        <div class="flex flex-wrap justify-between gap-3 mb-4">
                            <div>
                                <strong class="!text-[var(--text)]">Pedido #${order.id}</strong>
                                <p class="!text-sm !opacity-70 !text-[var(--text)]">Cliente: ${order.cliente?.nombre || 'N/A'} (${order.cliente?.email || 'N/A'})</p>
                                <p class="!text-sm !opacity-70 !text-[var(--text)]">Fecha: ${new Date(order.fechaPedido).toLocaleString()}</p>
                            </div>
                            <div class="!text-right">
                                <span class="status status-${order.estado.toLowerCase()}">${order.estado}</span>
                                <p class="!font-bold !text-base !mt-1 !text-[var(--text)]">Total: ${formatCOP(order.total)}</p>
                            </div>
                        </div>
                        <div class="!mb-3">
                            <strong class="!text-sm !text-[var(--text)]">Detalles:</strong>
                            <ul class="!mt-1.5 !pl-5 !text-sm !text-[var(--text)]">
                                ${(order.detalles || []).map(d => `<li>${d.producto?.nombre || 'Producto'} x${d.cantidad} - ${formatCOP(d.precioUnitario)}</li>`).join('')}
                            </ul>
                        </div>
                        <div class="flex gap-2 mt-3">
                            <button onclick="updateStatus(${order.id}, 'PENDIENTE')" class="!px-4 !py-2 !rounded-lg !text-sm !font-semibold !text-white !bg-[var(--primary)] hover:!bg-[var(--primary-hover)] !border-none !cursor-pointer transition-all duration-200 !shadow-sm hover:!shadow-md">Pendiente</button>
                            <button onclick="updateStatus(${order.id}, 'COMPLETADO')" class="!px-4 !py-2 !rounded-lg !text-sm !font-semibold !text-white !bg-[var(--success)] hover:!bg-green-700 !border-none !cursor-pointer transition-all duration-200 !shadow-sm hover:!shadow-md">Completar</button>
                            <button onclick="updateStatus(${order.id}, 'CANCELADO')" class="!px-4 !py-2 !rounded-lg !text-sm !font-semibold !text-white !bg-[var(--danger)] hover:!bg-red-700 !border-none !cursor-pointer transition-all duration-200 !shadow-sm hover:!shadow-md">Cancelar</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('orders-container').innerHTML = '<p class="error">Error al cargar datos.</p>';
            }
        }

        async function updateStatus(orderId, estado) {
            const token = getToken();
            try {
                await fetch(API_URL + '/admin/orders/' + orderId + '/status', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ estado })
                });
                loadAdminOrders();
            } catch (error) {
                alert('Error al actualizar estado');
            }
        }

        loadAdminOrders();
    </script>
</body>
</html>
