<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - ElectroShop</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { corePlugins: { preflight: false } }
    </script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <h2>Crear Cuenta</h2>
            <div id="message"></div>

            <form id="register-form">
                <div class="form-group">
                    <label>Nombre:</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Contrasena:</label>
                    <input type="password" id="password" required minlength="6">
                </div>
                <div class="form-group">
                    <label>Telefono:</label>
                    <input type="text" id="telefono">
                </div>
                <div class="form-group">
                    <label>Direccion:</label>
                    <input type="text" id="direccion">
                </div>
                <button type="submit" class="btn btn-primary">Registrarse</button>
            </form>

            <p class="form-footer">
                Ya tienes cuenta? <a href="login.html">Inicia Sesion</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = '';
            const data = {
                nombre: document.getElementById('nombre').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                telefono: document.getElementById('telefono').value,
                direccion: document.getElementById('direccion').value,
                rol: 'CLIENTE'
            };
            try {
                const response = await fetch(API_URL + '/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (response.ok) {
                    saveToken(result.token, result);
                    messageDiv.innerHTML = '<p class="success">Registro exitoso!</p>';
                    setTimeout(() => window.location.href = 'products.html', 1000);
                } else {
                    messageDiv.innerHTML = '<p class="error">' + result.message + '</p>';
                }
            } catch (error) {
                messageDiv.innerHTML = '<p class="error">Error de conexion.</p>';
            }
        });
    </script>
</body>
</html>
