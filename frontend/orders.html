<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pedidos - ElectroShop</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { corePlugins: { preflight: false } }
    </script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</head>
<body>
    <div class="container">
        <h2 class="page-title">Mis Pedidos</h2>
        <div id="orders-container">
            <p>Cargando pedidos...</p>
        </div>
    </div>

    <script>
        async function loadOrders() {
            const token = getToken();
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            try {
                const response = await fetch(API_URL + '/orders/my-orders', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!response.ok) {
                    window.location.href = 'login.html';
                    return;
                }
                const orders = await response.json();
                const container = document.getElementById('orders-container');
                if (!orders || orders.length === 0) {
                    container.innerHTML = '<p>No tienes pedidos ancora.</p><a href="products.html" class="btn btn-primary">Ir a la tienda</a>';
                    return;
                }
                container.innerHTML = orders.map(order => `
                    <div class="order-card">
                        <div class="order-header">
                            <div>
                                <strong>Pedido #${order.id}</strong>
                                <p>Fecha: ${new Date(order.fechaPedido).toLocaleString()}</p>
                            </div>
                            <div style="text-align: right;">
                                <span class="status status-${order.estado.toLowerCase()}">${order.estado}</span>
                                <p><strong>Total: ${formatCOP(order.total)}</strong></p>
                            </div>
                        </div>
                        <p><strong>Metodo de Pago:</strong> ${order.metodoPago}</p>
                        <p><strong>Direccion:</strong> ${order.direccionEnvio}</p>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('orders-container').innerHTML = '<p class="error">Error al cargar pedidos.</p>';
            }
        }

        loadOrders();
    </script>
</body>
</html>
