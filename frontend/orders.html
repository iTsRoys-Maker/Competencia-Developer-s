<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pedidos — Electronic Store</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] }}}}</script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>Mis Pedidos</h1>
            <p>Historial y seguimiento de tus compras</p>
        </div>
        <div id="orders-container"><p style="color:var(--text2)">Cargando pedidos...</p></div>
    </div>

    <script>
        async function loadOrders() {
            const token = getToken();
            if (!token) { window.location.href = 'login.html'; return; }
            try {
                const res = await fetch(API_URL + '/orders/my-orders', {
                    headers: { 
                        'Authorization': 'Bearer ' + token,
                        'Accept': 'application/json'
                    }
                });
                
                if (!res.ok) { 
                    throw new Error('Error al obtener pedidos');
                }
                
                const orders = await res.json();
                const container = document.getElementById('orders-container');
                if (!orders || orders.length === 0) {
                    container.innerHTML = `<div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" style="width:80px;height:80px;color:var(--border);margin-bottom:1rem"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
                        <h3>No tienes pedidos aún</h3>
                        <p>¡Explora nuestro catálogo y haz tu primera compra!</p>
                        <a href="products.html" class="btn btn-primary">Ir a la Tienda</a>
                    </div>`;
                    return;
                }
                container.innerHTML = orders.map(order => `
                    <div class="order-card fade-up">
                        <div class="order-header">
                            <div>
                                <strong style="font-size:1rem">Pedido ${order.numeroOrden || ('#' + order.id)}</strong>
                                <p style="font-size:.8rem;color:var(--text2);margin-top:.25rem">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:14px;height:14px;display:inline;vertical-align:-2px"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5"/></svg>
                                    ${new Date(order.fechaPedido).toLocaleString('es-CO')}
                                </p>
                            </div>
                            <div style="text-align:right">
                                <span class="status status-${order.estado.toLowerCase()}">${order.estado}</span>
                                <p style="font-weight:800;font-size:1.1rem;margin-top:.375rem;color:var(--accent)">${formatCOP(order.total)}</p>
                            </div>
                        </div>
                        <div style="display:flex;gap:1.5rem;flex-wrap:wrap;font-size:.85rem;color:var(--text2);padding-top:.75rem;border-top:1px solid var(--border)">
                            <span><strong>Pago:</strong> ${order.metodoPago}</span>
                            <span><strong>Envío:</strong> ${order.direccionEnvio}</span>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('orders-container').innerHTML = '<div class="msg msg-error">Error al cargar pedidos.</div>';
            }
        }
        loadOrders();
    </script>
</body>
</html>
