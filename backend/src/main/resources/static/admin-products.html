<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Productos — Electronic Store</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] }}}}</script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <p class="sidebar-title">Administración</p>
            <a href="admin.html">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>
                Dashboard
            </a>
            <a href="admin-products.html" class="active">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z"/></svg>
                Productos
            </a>
            <div class="sidebar-divider"></div>
            <a href="index.html">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3"/></svg>
                Volver a la Tienda
            </a>
        </aside>

        <main class="admin-content">
            <h2>Gestión de Productos</h2>

            <!-- Add Product Card -->
            <div class="card fade-up" style="margin-bottom:2rem">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">
                    <h3 style="font-size:1.05rem;font-weight:700">Agregar Nuevo Producto</h3>
                    <button class="btn btn-ghost btn-sm" id="toggleFormBtn" onclick="toggleForm()">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:16px;height:16px"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
                    </button>
                </div>
                <form id="product-form" style="display:none">
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem">
                        <div class="form-group"><label>Nombre</label><input type="text" id="nombre" required></div>
                        <div class="form-group"><label>Descripción</label><input type="text" id="descripcion"></div>
                        <div class="form-group"><label>Precio (COP)</label><input type="number" id="precio" step="1" required></div>
                        <div class="form-group"><label>Stock</label><input type="number" id="stock" required></div>
                        <div class="form-group"><label>Categoría</label><input type="text" id="categoria"></div>
                        <div class="form-group"><label>URL Imagen</label><input type="text" id="imagenUrl" placeholder="https://..."></div>
                    </div>
                    <button type="submit" class="btn btn-primary" style="margin-top:1rem">Agregar Producto</button>
                </form>
            </div>

            <!-- Products Table -->
            <div id="products-container"><p style="color:var(--text2)">Cargando productos...</p></div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal-overlay" style="display:none">
        <div class="modal">
            <div class="modal-header">
                <h3>Editar Producto</h3>
                <button class="modal-close" onclick="closeEditModal()">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:20px;height:20px"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <form id="edit-form">
                <input type="hidden" id="edit-id">
                <div class="form-group"><label>Nombre</label><input type="text" id="edit-nombre" required></div>
                <div class="form-group"><label>Precio (COP)</label><input type="number" id="edit-precio" step="1" required></div>
                <div class="form-group"><label>Stock</label><input type="number" id="edit-stock" required></div>
                <div style="display:flex;gap:.75rem;margin-top:1rem">
                    <button type="submit" class="btn btn-primary" style="flex:1">Guardar Cambios</button>
                    <button type="button" class="btn btn-outline" onclick="closeEditModal()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div id="deleteModal" class="modal-overlay" style="display:none">
        <div class="modal" style="max-width:400px;text-align:center">
            <h3 style="margin-bottom:.5rem">¿Eliminar producto?</h3>
            <p style="color:var(--text2);font-size:.9rem;margin-bottom:1.5rem">Esta acción no se puede deshacer.</p>
            <div style="display:flex;gap:.75rem;justify-content:center">
                <button class="btn btn-danger" id="confirmDeleteBtn">Eliminar</button>
                <button class="btn btn-outline" onclick="closeDeleteModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        let formVisible = false;
        let deleteTargetId = null;

        function toggleForm() {
            formVisible = !formVisible;
            document.getElementById('product-form').style.display = formVisible ? 'block' : 'none';
        }

        async function loadProducts() {
            const token = getToken();
            const user = getUser();
            if (!token || user?.rol !== 'ADMIN') { window.location.href = 'login.html'; return; }
            try {
                const res = await fetch(API_URL + '/products');
                const products = await res.json();
                const container = document.getElementById('products-container');
                if (!products || products.length === 0) {
                    container.innerHTML = '<p style="color:var(--text2)">No hay productos registrados.</p>';
                    return;
                }
                const fallbackImg = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%2394a3b8" stroke-width="1"><path d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3"/></svg>');
                container.innerHTML = `<div class="table-wrap fade-up"><table>
                    <thead><tr><th>Imagen</th><th>Producto</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead>
                    <tbody>${products.map(p => `<tr>
                        <td><img src="${p.imagenUrl || fallbackImg}" alt="${p.nombre}" style="width:44px;height:44px;object-fit:cover;border-radius:.5rem;background:var(--bg)" onerror="this.src='${fallbackImg}'"></td>
                        <td><div style="font-weight:600">${p.nombre}</div><div style="font-size:.75rem;color:var(--text2)">${p.categoria || ''}</div></td>
                        <td style="font-weight:700;color:var(--success)">${formatCOP(p.precio)}</td>
                        <td>${stockBadge(p.stock)}</td>
                        <td><div style="display:flex;gap:.375rem">
                            <button onclick="openEditModal(${p.id},'${(p.nombre||'').replace(/'/g,"\\'")}',${p.precio},${p.stock})" class="btn btn-outline btn-sm">Editar</button>
                            <button onclick="openDeleteModal(${p.id})" class="btn btn-danger btn-sm">Eliminar</button>
                        </div></td>
                    </tr>`).join('')}</tbody>
                </table></div>`;
            } catch (error) {
                document.getElementById('products-container').innerHTML = '<div class="msg msg-error">Error al cargar productos.</div>';
            }
        }

        // Add product
        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = getToken();
            const producto = {
                nombre: document.getElementById('nombre').value,
                descripcion: document.getElementById('descripcion').value,
                precio: parseFloat(document.getElementById('precio').value),
                stock: parseInt(document.getElementById('stock').value),
                categoria: document.getElementById('categoria').value,
                imagenUrl: document.getElementById('imagenUrl').value
            };
            try {
                const res = await fetch(API_URL + '/products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify(producto)
                });
                if (res.ok) {
                    showToast('Producto agregado exitosamente', 'success');
                    document.getElementById('product-form').reset();
                    loadProducts();
                }
            } catch (e) { showToast('Error al agregar producto', 'error'); }
        });

        // Edit modal
        function openEditModal(id, nombre, precio, stock) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-nombre').value = nombre;
            document.getElementById('edit-precio').value = precio;
            document.getElementById('edit-stock').value = stock;
            document.getElementById('editModal').style.display = 'flex';
        }
        function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }

        document.getElementById('edit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = getToken();
            const id = document.getElementById('edit-id').value;
            try {
                await fetch(API_URL + '/products/' + id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({
                        nombre: document.getElementById('edit-nombre').value,
                        precio: parseFloat(document.getElementById('edit-precio').value),
                        stock: parseInt(document.getElementById('edit-stock').value)
                    })
                });
                showToast('Producto actualizado', 'success');
                closeEditModal();
                loadProducts();
            } catch (e) { showToast('Error al editar', 'error'); }
        });

        // Delete modal
        function openDeleteModal(id) {
            deleteTargetId = id;
            document.getElementById('deleteModal').style.display = 'flex';
        }
        function closeDeleteModal() { document.getElementById('deleteModal').style.display = 'none'; deleteTargetId = null; }

        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            if (!deleteTargetId) return;
            const token = getToken();
            try {
                await fetch(API_URL + '/products/' + deleteTargetId, {
                    method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token }
                });
                showToast('Producto eliminado', 'success');
                closeDeleteModal();
                loadProducts();
            } catch (e) { showToast('Error al eliminar', 'error'); }
        });

        loadProducts();
    </script>
</body>
</html>
