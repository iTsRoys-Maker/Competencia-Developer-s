<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo de productos Electronic Store — Laptops, smartphones, audífonos y más.">
    <title>Productos — Electronic Store</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] }}}}</script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>Nuestros Productos</h1>
            <p>Encuentra la tecnología perfecta para ti</p>
        </div>

        <div class="search-bar" id="search-bar">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
            <input type="text" id="searchInput" placeholder="Buscar productos..." oninput="filterProducts()">
        </div>

        <div id="products-container" class="products-grid"></div>
    </div>

    <script>
        let allProducts = [];

        async function loadProducts() {
            const container = document.getElementById('products-container');
            renderProductSkeletons(container, 8);
            try {
                const res = await fetch(API_URL + '/products');
                allProducts = await res.json();
                renderProducts(allProducts);
            } catch (error) {
                container.innerHTML = '<div class="empty-state"><h3>No se pudieron cargar los productos</h3><p>Asegúrate de que el servidor esté corriendo.</p><a href="products.html" class="btn btn-primary">Reintentar</a></div>';
            }
        }

        function renderProducts(products) {
            const container = document.getElementById('products-container');
            if (!products || products.length === 0) {
                container.innerHTML = '<div class="empty-state"><h3>No hay productos disponibles</h3><p>Vuelve más tarde para ver nuestro catálogo.</p></div>';
                return;
            }
            container.innerHTML = products.map(p => {
                const hasImage = p.imagenUrl && p.imagenUrl.trim() !== '';
                const fallbackSvg = `<div class="img-fallback"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" style="width:48px;height:48px;opacity:.4"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3"/></svg></div>`;
                return `
                <div class="product-card fade-up">
                    <div class="img-wrap">
                        ${hasImage ? `<img src="${p.imagenUrl}" alt="${p.nombre}" loading="lazy" onerror="handleImgError(this)">` : fallbackSvg}
                    </div>
                    <div class="card-body">
                        ${p.categoria ? `<span class="category-badge">${p.categoria}</span>` : ''}
                        <h3>${p.nombre}</h3>
                        <p class="description">${p.descripcion || ''}</p>
                        <p class="price">${formatCOP(p.precio)}</p>
                        <p class="stock-info">${stockBadge(p.stock)}</p>
                        <button onclick="addToCart(${p.id})" class="btn btn-primary" ${p.stock <= 0 ? 'disabled style="opacity:.5;cursor:not-allowed"' : ''}>
                            ${p.stock > 0 ? 'Agregar al Carrito' : 'Agotado'}
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        function filterProducts() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!q) { renderProducts(allProducts); return; }
            const filtered = allProducts.filter(p =>
                p.nombre.toLowerCase().includes(q) ||
                (p.descripcion && p.descripcion.toLowerCase().includes(q)) ||
                (p.categoria && p.categoria.toLowerCase().includes(q))
            );
            renderProducts(filtered);
        }

        async function addToCart(productId) {
            const token = localStorage.getItem('token');
            if (!token) {
                showToast('Debes iniciar sesión primero', 'error');
                setTimeout(() => window.location.href = 'login.html', 1200);
                return;
            }
            try {
                const res = await fetch(API_URL + '/cart/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ productoId: productId, cantidad: 1 })
                });
                if (res.ok) {
                    showToast('Producto agregado al carrito', 'success');
                    updateCartCount();
                } else {
                    showToast('Error al agregar al carrito', 'error');
                }
            } catch (error) {
                showToast('Error de conexión', 'error');
            }
        }

        loadProducts();
    </script>
</body>
</html>
