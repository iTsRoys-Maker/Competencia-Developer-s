<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin — Electronic Store</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] }}}}</script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <p class="sidebar-title">Administración</p>
            <a href="admin.html" class="active">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>
                Dashboard
            </a>
            <a href="admin-products.html">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z"/></svg>
                Productos
            </a>
            <div class="sidebar-divider"></div>
            <a href="index.html">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3"/></svg>
                Volver a la Tienda
            </a>
        </aside>

        <main class="admin-content">
            <h2>Gestión de Pedidos</h2>

            <div class="stats-grid" id="stats">
                <div class="stat-card accent fade-up">
                    <div class="stat-icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007z"/></svg></div>
                    <h3 id="total-pedidos">0</h3>
                    <p>Total Pedidos</p>
                </div>
                <div class="stat-card warning fade-up">
                    <div class="stat-icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
                    <h3 id="pedidos-pendientes">0</h3>
                    <p>Pendientes</p>
                </div>
                <div class="stat-card success fade-up">
                    <div class="stat-icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
                    <h3 id="pedidos-completados">0</h3>
                    <p>Completados</p>
                </div>
                <div class="stat-card danger fade-up">
                    <div class="stat-icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0115.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 013 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 00-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 01-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 003 15h-.75M15 10.5a3 3 0 11-6 0 3 3 0 016 0zm3 0h.008v.008H18V10.5zm-12 0h.008v.008H6V10.5z"/></svg></div>
                    <h3 id="total-ventas">$0</h3>
                    <p>Total Ventas</p>
                </div>
            </div>

            <div id="orders-container"><p style="color:var(--text2)">Cargando pedidos...</p></div>
        </main>
    </div>

    <script>
        async function loadAdminOrders() {
            const token = getToken();
            const user = getUser();
            if (!token || user?.rol !== 'ADMIN') { window.location.href = 'login.html'; return; }
            try {
                const [ordersRes, statsRes] = await Promise.all([
                    fetch(API_URL + '/admin/orders', { headers: { 'Authorization': 'Bearer ' + token } }),
                    fetch(API_URL + '/admin/stats', { headers: { 'Authorization': 'Bearer ' + token } })
                ]);
                const orders = await ordersRes.json();
                const stats = await statsRes.json();
                document.getElementById('total-pedidos').textContent = stats.totalPedidos || 0;
                document.getElementById('pedidos-pendientes').textContent = stats.pedidosPendientes || 0;
                document.getElementById('pedidos-completados').textContent = stats.pedidosCompletados || 0;
                document.getElementById('total-ventas').textContent = formatCOP(stats.totalVentas || 0);
                const container = document.getElementById('orders-container');
                if (!orders || orders.length === 0) {
                    container.innerHTML = '<p style="color:var(--text2)">No hay pedidos aún.</p>';
                    return;
                }
                container.innerHTML = orders.map(order => `
                    <div class="order-card fade-up">
                        <div class="order-header">
                            <div>
                                <strong>Pedido #${order.id}</strong>
                                <p style="font-size:.8rem;color:var(--text2)">Cliente: ${order.cliente?.nombre || 'N/A'} (${order.cliente?.email || 'N/A'})</p>
                                <p style="font-size:.8rem;color:var(--text2)">${new Date(order.fechaPedido).toLocaleString('es-CO')}</p>
                            </div>
                            <div style="text-align:right">
                                <span class="status status-${order.estado.toLowerCase()}">${order.estado}</span>
                                <p style="font-weight:800;margin-top:.25rem;color:var(--accent)">${formatCOP(order.total)}</p>
                            </div>
                        </div>
                        <div style="font-size:.85rem;margin-bottom:.75rem">
                            <strong style="color:var(--text2)">Detalles:</strong>
                            <ul style="margin-top:.375rem;padding-left:1.25rem;color:var(--text2)">
                                ${(order.detalles || []).map(d => `<li>${d.producto?.nombre || 'Producto'} x${d.cantidad} — ${formatCOP(d.precioUnitario)}</li>`).join('')}
                            </ul>
                        </div>
                        <div class="order-actions">
                            <button onclick="updateStatus(${order.id}, 'PENDIENTE')" class="btn btn-outline btn-sm">Pendiente</button>
                            <button onclick="updateStatus(${order.id}, 'COMPLETADO')" class="btn btn-success btn-sm">Completar</button>
                            <button onclick="updateStatus(${order.id}, 'CANCELADO')" class="btn btn-danger btn-sm">Cancelar</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('orders-container').innerHTML = '<div class="msg msg-error">Error al cargar datos.</div>';
            }
        }

        async function updateStatus(orderId, estado) {
            const token = getToken();
            try {
                await fetch(API_URL + '/admin/orders/' + orderId + '/status', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ estado })
                });
                showToast('Estado actualizado', 'success');
                loadAdminOrders();
            } catch (e) { showToast('Error al actualizar', 'error'); }
        }

        loadAdminOrders();
    </script>
</body>
</html>
