<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Ecommerce POO</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Ecommerce POO</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="products.html">Productos</a>
            <a href="login.html">Iniciar Sesion</a>
        </nav>
    </header>
    
    <main>
        <form id="register-form">
            <h2>Crear Cuenta</h2>
            <div id="message"></div>
            
            <div class="form-group">
                <label>Nombre:</label>
                <input type="text" id="nombre" required>
            </div>
            
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" required>
            </div>
            
            <div class="form-group">
                <label>Contrasena:</label>
                <input type="password" id="password" required minlength="6">
            </div>
            
            <div class="form-group">
                <label>Telefono:</label>
                <input type="text" id="telefono">
            </div>
            
            <div class="form-group">
                <label>Direccion:</label>
                <input type="text" id="direccion">
            </div>
            
            <button type="submit" class="btn">Registrarse</button>
            <p style="text-align: center; margin-top: 1rem;">
                Ya tienes cuenta? <a href="login.html">Inicia Sesion</a>
            </p>
        </form>
    </main>
    
    <footer>
        <p>&copy; 2026 Ecommerce POO - Proyecto Academico</p>
    </footer>
    
    <script src="js/api.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = '';
            
            const data = {
                nombre: document.getElementById('nombre').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                telefono: document.getElementById('telefono').value,
                direccion: document.getElementById('direccion').value,
                rol: 'CLIENTE'
            };
            
            try {
                const response = await fetch(API_URL + '/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    saveToken(result.token, result);
                    messageDiv.innerHTML = '<p class="success">Registro exitoso!</p>';
                    setTimeout(() => window.location.href = 'products.html', 1000);
                } else {
                    messageDiv.innerHTML = '<p class="error">' + result.message + '</p>';
                }
            } catch (error) {
                messageDiv.innerHTML = '<p class="error">Error de conexion.</p>';
            }
        });
    </script>
</body>
</html>
