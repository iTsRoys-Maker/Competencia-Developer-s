<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Electronic Store</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] }}}}</script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</head>
<body>
    <div class="container" style="display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 160px)">
        <div style="width:100%;max-width:440px">
            <div class="form-card fade-up">
                <h2>Bienvenido de vuelta</h2>
                <p class="subtitle">Ingresa a tu cuenta para continuar</p>
                <div id="message"></div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <div class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/></svg>
                            <input type="email" id="email" placeholder="tu@email.com" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
                            <input type="password" id="password" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;margin-top:.5rem">Iniciar Sesión</button>
                </form>

                <p class="form-footer">
                    ¿No tienes cuenta? <a href="register.html">Crear cuenta</a>
                </p>
            </div>

            <div class="test-accounts fade-up">
                <h3>🔑 Cuentas de prueba</h3>
                <p><strong>Admin:</strong> admin@ecommerce.com / admin123</p>
                <p><strong>Cliente:</strong> juan@email.com / cliente123</p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = '';
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch(API_URL + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    saveToken(data.token, data);
                    messageDiv.innerHTML = '<div class="msg msg-success">✓ Login exitoso! Redirigiendo...</div>';
                    setTimeout(() => {
                        window.location.href = data.rol === 'ADMIN' ? 'admin.html' : 'products.html';
                    }, 800);
                } else {
                    messageDiv.innerHTML = `<div class="msg msg-error">✕ ${data.message || 'Credenciales inválidas'}</div>`;
                }
            } catch (error) {
                messageDiv.innerHTML = '<div class="msg msg-error">✕ Error de conexión. Asegúrate de que el servidor esté corriendo.</div>';
            }
        });
    </script>
</body>
</html>
