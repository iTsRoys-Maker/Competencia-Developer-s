# ============================================================
# PERFIL MYSQL - Configuración lista para producción
# Para activarlo ejecutar con: --spring.profiles.active=mysql
# O en NetBeans/IDE: agregar -Dspring.profiles.active=mysql
# ============================================================

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_poo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# Dialect MySQL (auto-detectado, pero explícito para seguridad)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Deshabilitar consola H2 en perfil MySQL
spring.h2.console.enabled=false

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
