spring.application.name=ecommerce-poo

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_poo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
# spring.jpa.database-platform is auto-detected for MySQL

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=EcommercePOO2026SecretKeyParaTokenJWTMustBeAtLeast256Bits
jwt.expiration=86400000
