spring.application.name=ecommerce-poo

# ============================================================
# BASE DE DATOS ACTIVA: H2 (embebida, persistente en archivo)
# Modo MySQL activado para máxima compatibilidad con el código
# Para usar MySQL: ejecutar con --spring.profiles.active=mysql
# ============================================================

spring.datasource.url=jdbc:h2:file:./data/ecommerce_poo;MODE=MySQL;NON_KEYWORDS=VALUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialect H2 (Spring Boot lo detecta automáticamente, pero lo forzamos)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Consola web H2 (accesible en http://localhost:8080/h2-console durante desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=EcommercePOO2026SecretKeyParaTokenJWTMustBeAtLeast256Bits
jwt.expiration=86400000
